<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Master</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="particles"></div>

<!-- Tela Inicial -->

<section id="start-screen">

<div class="card">

<h1>QUIZ MASTER</h1>

<p>Digite seu nome para começar</p>

<input
type="text"
id="playerName"
placeholder="Seu nome">

<button id="startBtn">
Começar
</button>

</div>

</section>

<!-- Quiz -->

<section id="quiz-screen" class="hidden">

<div class="top">

<div>

<h2 id="welcome"></h2>

<p id="counter">
Pergunta 1/10
</p>

</div>

<div class="scoreBox">

<span>Pontos</span>

<h3 id="score">
0
</h3>

</div>

</div>

<div class="progress">

<div id="progress-bar"></div>

</div>

<div class="quiz-card">

<h2 id="question">
Pergunta
</h2>

<div id="answers">

</div>

<button
id="nextBtn"
class="hidden">

Próxima →

</button>

</div>

</section>

<!-- Resultado -->

<section id="result-screen" class="hidden">

<div class="card result">

<h1>🏆 Resultado</h1>

<h2 id="playerFinal"></h2>

<div class="numbers">

<div>

<h3 id="hits">
0
</h3>

<p>Acertos</p>

</div>

<div>

<h3 id="errors">
0
</h3>

<p>Erros</p>

</div>

<div>

<h3 id="percent">
0%
</h3>

<p>Aproveitamento</p>

</div>

</div>

<p id="message">

</p>

<button onclick="location.reload()">

Jogar Novamente

</button>

</div>

</section>

<!-- Confetes -->

<div id="confetti"></div>

<script src="script.js"></script>

</body>

</html>
